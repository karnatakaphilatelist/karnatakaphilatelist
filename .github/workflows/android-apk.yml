name: Android debug APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Site the app loads (e.g. a Vercel preview URL). Blank = production."
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["android/**", "capacitor.config.ts", "native-www/**", "package.json"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Sync Capacitor
        run: npx cap sync android
        env:
          CAP_SERVER_URL: ${{ inputs.server_url }}
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: philatelist-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
