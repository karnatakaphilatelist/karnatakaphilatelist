name: iOS simulator build

# Unsigned build for the iOS Simulator. It proves the iOS shell compiles; a device or
# TestFlight build needs an Apple Developer account (see docs/MOBILE.md).
on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Site the app loads (e.g. a Vercel preview URL). Blank = production."
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync Capacitor
        run: npx cap sync ios
        env:
          CAP_SERVER_URL: ${{ inputs.server_url }}
      - name: Build for simulator
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
