name: philatrail
description: Philatrail mobile app — the field companion for the Philately Passport.
publish_to: "none"
# Build number (+100) clears every versionCode the Capacitor builds used on
# Play (1-9 so far, run_number based); the old note follows. Build number (+8) was set strictly higher than the highest versionCode seen
# on the Play Console closed-testing track as of 24 Nov 2026 — release 7
# (v1.0.4) was drafted but not yet sent for review, release 5 (v1.0.2) is the
# one currently live to testers. Using 8 (not 6) keeps this safe even if 7
# ships first. Confirm/bump this again before the first real Flutter build.
version: 1.1.0+103

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Same backend the web app uses — no custom API layer for plain reads/writes,
  # per CLAUDE.md section 3 (Supabase + RLS is the shared contract).
  supabase_flutter: ^2.8.0

  # Navigation
  go_router: ^14.6.0

  # Map (web app uses react-leaflet + OSM/MapTiler tiles — flutter_map is the
  # same OSM-tile-based model, no Google Maps API key/billing needed)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Device & field capabilities (mirrors src/lib/geofence.ts, geo.ts, haptics.ts,
  # nearby-notifications.ts, native-photo.ts, in-app-review.ts)
  geolocator: ^13.0.0
  # Free alternative to flutter_background_geolocation (Transistor Software,
  # $399+ one-time commercial license) — the user explicitly declined that
  # cost on 24 Nov 2026. This keeps a persistent Android foreground service
  # alive to poll location while the app is backgrounded; it does not match
  # iOS's true closed-app background tracking the paid SDK provides (iOS
  # background execution is far more restricted without it) — see the doc
  # comment on NearbyNotificationService for the honest limitation.
  flutter_foreground_task: ^8.17.0
  flutter_local_notifications: ^18.0.0
  image_picker: ^1.1.0
  url_launcher: ^6.3.1
  in_app_review: ^2.0.9
  # Native Google sign-in (idToken handed to Supabase's signInWithIdToken) —
  # chosen over porting the web app's browser-redirect OAuth flow, which
  # would need a custom URL scheme on both platforms plus a new Supabase
  # redirect-URL allowlist entry (a dashboard change this assistant can't
  # make). Needs its own Android/iOS OAuth client IDs from Google Cloud,
  # keyed to this app's package name/bundle ID and (for Android) the debug
  # keystore's SHA-1 committed at android/app/debug.keystore — and the
  # existing *Web* client ID passed at build time as
  # --dart-define=GOOGLE_WEB_CLIENT_ID; see data/auth_controller.dart's doc
  # comment for exactly which client ID goes where.
  google_sign_in: ^6.2.1
  # Share sheet for progress sharing (mirrors src/lib/share.ts's @capacitor/share).
  share_plus: ^10.1.4

  # Local persistence (mirrors src/lib/local-storage.ts's guest-visits/planned-ids storage)
  shared_preferences: ^2.3.0

  # Home-screen widget data bridge (native glue still required either side —
  # see DESIGN.md / CLAUDE.md widget note; this only pushes data + triggers reloads)
  home_widget: ^0.7.0

  # Renders the real brand SVGs (guilloche security-print texture, wordmark)
  # vendored straight from the web app's public/brand/ — so the Passport
  # header and sign-in sheet match philatrail.com pixel-for-pixel instead of
  # an approximated gradient.
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # The real Google "G" logo (src/components/ui/icons.tsx's GoogleIcon,
    # rendered to PNG — see assets/icons/README.txt), used on the Google
    # sign-in button instead of Material's unrelated "g_mobiledata" glyph.
    - assets/icons/google_logo.png
    # The exact guilloche security-print texture (public/brand/guilloche.svg)
    # the web app lays over its red surfaces (.kp-red: Passport header,
    # sign-in sheet hero, guest "save progress" card).
    - assets/brand/guilloche.svg
    # src/data/post-offices.snapshot.json, the list the web app falls back to
    # when the database can't be reached (see office_repository.dart).
    - assets/data/post-offices.snapshot.json
  # Same brand fonts as the web app: Fraunces (display), Figtree (body),
  # Courier Prime (mono) — cut from the exact fontsource "latin" files the web
  # serves for English text (node_modules/@fontsource-variable/*/files/
  # *-latin-wght-*.woff2, @fontsource/courier-prime latin 400). An earlier
  # copy here was the latin-ext subset, which has no basic a–z, so every
  # lowercase letter silently fell back to Roboto. The variable files are
  # instanced to one static file per weight (fontTools varLib.instancer)
  # because their default instances are Figtree 300 / Fraunces 900 and
  # Flutter doesn't reliably drive a variable font's wght axis from
  # TextStyle.fontWeight. Courier Prime ships 400 only, like the web, so
  # bold mono is synthesized the same way the browser does it.
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Light.ttf
          weight: 300
        - asset: assets/fonts/Fraunces-Regular.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-Medium.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Fraunces-Black.ttf
          weight: 900
        - asset: assets/fonts/Fraunces-RegularItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Fraunces-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Fraunces-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Fraunces-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Fraunces-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Fraunces-BlackItalic.ttf
          weight: 900
          style: italic
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Light.ttf
          weight: 300
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Figtree-Black.ttf
          weight: 900
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
